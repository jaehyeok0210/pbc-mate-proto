// 필요일 타임라인: 오늘(0일)부터 가장 먼 필요일까지. 최소 15일 폭으로 그린다.
function timeline(sorted, today) {
  const span = Math.max(15, Math.max(...sorted.map((x) => x.left)) + 1);
  const pct = (days) => `${(Math.max(0, days) / span) * 100}%`;

  const byLeft = [...sorted].sort((a, b) => a.left - b.left);
  const marks = byLeft.map((x, i) => {
    const pos = Math.max(0, x.left) / span;
    const side = i % 2 === 0 ? 'above' : 'below';
    const anchor = pos > 0.85 ? 'end' : 'start';
    const extra = x.status === 'fix' ? ' · 보완 요청' : '';
    return `
      <div class="tl-mark risk-${x.risk} ${side} anchor-${anchor}" style="left:${pct(x.left)}">
        <span class="tl-stem"></span><span class="tl-dot"></span>
        <span class="tl-label ${x.risk === 'high' || x.risk === 'late' ? 'is-urgent' : ''} ${x.status === 'fix' ? 'is-fix' : ''}">
          <b>${esc(x.name)}</b><span>${formatMD(x.neededOn)} · ${leftText(x.left)}${extra}</span>
        </span>
      </div>`;
  }).join('');

  const ticks = tickDays(today, span).map((d) =>
    `<span class="tl-tick" style="left:${pct(d)}">${formatMD(addDays(today, d))}</span>`).join('');

  return `
    <section class="timeline desktop-only">
      <div class="tl-head">
        <div class="tl-title">필요일 타임라인 <span>· 오늘부터 각 자료의 필요일까지</span></div>
        <div class="tl-legend">
          <span class="risk-high">${ICON.high}<i>2일 이내</i></span>
          <span class="risk-mid">${ICON.mid}<i>3~7일</i></span>
          <span class="risk-low">${ICON.low}<i>8일 이상</i></span>
        </div>
      </div>
      <div class="tl-track">
        <div class="tl-seg risk-high" style="left:0;width:${pct(Math.min(2, span))}"></div>
        <div class="tl-seg risk-mid" style="left:${pct(2)};width:${pct(Math.min(5, span - 2))}"></div>
        <div class="tl-seg risk-low" style="left:${pct(7)};right:0"></div>
        <span class="tl-now"></span>
        <span class="tl-tick is-today" style="left:0">오늘 ${formatMD(today)}</span>
        ${ticks}
        ${marks}
      </div>
    </section>`;
}

// 날짜 눈금: 5의 배수 날짜(5, 10, 15 …)에 표시하되 오늘 라벨과 겹치지 않게 3일 이후부터.
function tickDays(today, span) {
  const days = [];
  for (let d = 3; d < span; d++) {
    if (Number(addDays(today, d).slice(8)) % 5 === 0) days.push(d);
  }
  return days;
}

function composeHref(item) {
  return `#/compose/${encodeURIComponent(item.id)}`;
}

function bundleHref(owner) {
  return `#/bundle/${encodeURIComponent(owner)}`;
}

function fixHref(item) {
  return `#/fix/${encodeURIComponent(item.id)}`;
}

// 자료를 눌렀을 때: 보완 요청 자료는 보완 요청 화면, 나머지는 단건 독촉
function itemHref(x) {
  return x.status === 'fix' ? fixHref(x) : composeHref(x);
}

function nameLink(x) {
  return `<a class="row-name" href="${itemHref(x)}">${esc(x.name)}</a>`;
}

function statusBadge(status) {
  return `<span class="status status-${status}">${ICON[status]}${STATUS_LABEL[status]}</span>`;
}

function riskBadge(risk, short = false) {
  return `<span class="risk risk-${risk}">${ICON[risk]}${short ? RISK_SHORT[risk] : RISK_LABEL[risk]}</span>`;
}

function itemMeta(x) {
  if (x.status === 'fix') return x.reason || '보완 요청';
  return `${formatMD(x.neededOn)} 필요 · 요청 ${formatMD(x.requestedOn)} · D+${x.elapsed}`;
}

function leftBig(left) {
  if (left === 0) return `<b>오늘</b>`;
  return `<b>${Math.abs(left)}</b><span>${left > 0 ? '일 남음' : '일 지남'}</span>`;
}

function ownerCards(groups, people, done, text) {
  const topId = groups[0].items[0].id;

  const cards = groups.map((g, i) => {
    const person = people[g.owner] || {};
    const doneHere = done.filter((x) => x.owner === g.owner);
    const nudged = person.nudges
      ? `마지막 독촉 ${formatMD(person.lastNudgedOn)} · 독촉 ${person.nudges}회`
      : '아직 독촉하지 않았어요';

    const rows = g.items.map((x) => `
      <div class="row ${x.id === topId ? 'is-top' : ''}">
        <div class="row-main">
          <div class="row-title">
            ${nameLink(x)}
            ${x.id === topId ? `<span class="top-badge">${text.top}</span>` : ''}
          </div>
          <div class="row-meta">${statusBadge(x.status)}<span class="ellipsis">${esc(itemMeta(x))}</span></div>
        </div>
        <div class="row-left">
          <div class="left-big">${leftBig(x.left)}</div>
          ${riskBadge(x.risk)}
        </div>
      </div>`).join('');

    const doneLine = doneHere.length
      ? `<div class="done-line">${ICON.done}완료 ${doneHere.length}건 · ${doneHere.map((x) => esc(x.name)).join(', ')}</div>`
      : '';

    // 버튼 건수는 묶음 독촉 화면과 같은 기준(보완 요청 제외)으로 센다.
    const bundlable = g.items.filter(isBundleEligible);
    let cta;
    if (bundlable.length > 1) {
      cta = `<a class="btn btn-cta" href="${bundleHref(g.owner)}">
        ${bundlable.length}건 묶어서 독촉 <span class="cta-sub">· 메일 1통</span></a>`;
    } else if (bundlable.length === 1) {
      cta = `<a class="btn btn-sub" href="${composeHref(bundlable[0])}">${esc(bundlable[0].name)} 독촉하기</a>`;
    } else {
      cta = `<a class="btn btn-sub" href="${fixHref(g.items[0])}">보완 재요청 메일 쓰기</a>`;
    }

    return `
      <div class="card">
        <div class="card-head">
          <div class="rank">${i + 1}</div>
          <div class="card-who">
            <div class="card-name">${esc(g.owner)} <span>${esc(person.dept || '')}</span></div>
            <div class="card-nudge">${nudged}</div>
          </div>
          <div class="card-count"><span>미완료</span><b>${g.items.length}건</b></div>
        </div>
        ${rows}
        ${doneLine}
        ${cta}
      </div>`;
  }).join('');

  return `
    <section class="owners desktop-only">
      <div class="section-head">
        <h2>담당자별로 묶어 재촉하기</h2>
        <div class="section-hint">같은 담당자에게는 메일 한 통으로 · ${text.group}</div>
      </div>
      <div class="cards">${cards}</div>
    </section>`;
}

// 모바일(레퍼런스 1-M): 담당자 묶음 대신 한 줄 목록 + 가장 많이 밀린 담당자 묶음 버튼
function mobileList(sorted, topLabel) {
  // 보완 요청 자료는 단건 독촉 대신 보완 요청 화면으로 연결한다.
  const rows = sorted.map((x, i) => `
    <a href="${itemHref(x)}" class="m-row ${i === 0 ? 'is-top' : ''}">
      <span class="m-left">
        <span class="m-days">${x.left === 0 ? '오늘' : `${Math.abs(x.left)}<small>일${x.left < 0 ? ' 지남' : ''}</small>`}</span>
        ${riskBadge(x.risk, true)}
      </span>
      <span class="m-main">
        <span class="row-title"><span class="row-name">${esc(x.name)}</span>${i === 0 ? `<span class="top-badge">${topLabel}</span>` : ''}</span>
        <span class="row-meta">${statusBadge(x.status)}<span class="ellipsis">${esc(x.status === 'fix' ? (x.reason || '보완 요청') : `${x.owner} · D+${x.elapsed}`)}</span></span>
      </span>
    </a>`).join('');

  const biggest = groupByOwner(sorted.filter(isBundleEligible))
    .reduce((a, b) => (b.items.length > a.items.length ? b : a), { items: [] });
  const bundle = biggest.items.length > 1 ? `
    <a class="m-bundle" href="${bundleHref(biggest.owner)}">
      <span><b>${esc(biggest.owner)} ${biggest.items.length}건 묶어서 독촉</b><small>개별 메일 ${biggest.items.length}통 대신 1통</small></span>
      ${ICON.chevron}
    </a>` : '';

  return `<section class="m-list mobile-only">${rows}</section>${bundle ? `<div class="mobile-only">${bundle}</div>` : ''}`;
}

function allDone() {
  return `
    <section class="all-done">
      ${ICON.done}
      <h1>요청한 자료를 모두 받았어요</h1>
      <p>새로 요청할 자료가 생기면 추가해 주세요.</p>
    </section>`;
}

return { renderDashboard, topbar };
})();

// 4. 보완 요청 — 레퍼런스 4 / 4-1
// 데스크톱은 대시보드 위 오른쪽 패널, 모바일(720px 이하)은 전체 화면.


/**
 * @param state 앱 상태
 * @param opts  { today, itemId, reason, copied, toast }
 */
function renderFix(state, { today, itemId, reason, copied, toast }) {
  const item = withDays(state.items.find((x) => x.id === itemId), today);
  const person = state.people[item.owner] || {};
  const mail = buildFixMail({ item, person, client: state.client, today, reason });
  const dates = mailDates([item], today, { replyBy: false });
  const label = fixReasonLabel(reason);
  const lastFix = (item.fixes || [])[item.fixes?.length - 1];
  const nudges = (item.nudges || []).length;

  const flow = [
    `<span class="flow-chip">${formatMD(item.requestedOn)} 요청</span>`,
    nudges ? `<span class="flow-chip">독촉 ${nudges}회</span>` : '',
    item.received ? `<span class="flow-chip">${formatMD(item.received.on)} 파일 수령</span>` : '',
    lastFix ? `<span class="flow-chip is-fix">${formatMD(lastFix.on)} 보완 요청</span>` : '',
  ].filter(Boolean).join(`<span class="flow-arrow">${ICON.chevron}</span>`);

  const reasons = FIX_REASONS.map((r) => `
    <button type="button" class="reason-btn" data-action="set-reason" data-reason="${r.key}" aria-pressed="${r.key === reason}">
      <b>${r.label}</b><small>${r.hint}</small>
    </button>`).join('');

  const statusSeg = ['none', 'part', 'fix', 'done'].map((s) => `
    <span class="status-seg-item ${s === 'fix' ? 'is-current' : ''}">${ICON[s]}${STATUS_LABEL[s]}</span>`).join('');

  const body = mail.segments.map((s) => {
    if (s.kind === 'field') return mailField(s.text, dates);
    if (s.kind === 'reason') return `<span class="m-reason">${esc(s.text)}</span>`;
    return esc(s.text);
  }).join('');

  const footNote = copied && lastFix
    ? `${ICON.done}보완 요청 이력에 기록했어요 · ${formatMD(lastFix.on)} ${fixReasonLabel(lastFix.reason)}`
    : `<span>복사하면 보완 요청 이력에 <b>${label}</b>(으)로 기록돼요. 상태는 보완 요청 그대로예요.</span>`;

  return `
    <div class="drawer-dim" data-action="close-drawer"></div>
    <aside class="drawer fix" role="dialog" aria-modal="true" aria-labelledby="fix-title">
      <header class="m-header mobile-only">
        <button type="button" class="icon-btn" data-action="close-drawer" aria-label="뒤로">${ICON.back}</button>
        <div class="m-header-title">보완 요청</div>
      </header>

      <div class="drawer-body">
        <div class="compose-head">
          <div class="compose-who">
            <div class="eyebrow desktop-only">받은 자료 확인 · 감사에 그대로 쓸 수 있나요?</div>
            <h2 id="fix-title">${esc(item.name)}</h2>
            <div class="fix-sub">${esc(item.owner)}${person.dept ? ` · ${esc(person.dept)}` : ''} · ${formatMDW(item.neededOn)} 필요 · ${leftText(item.left)}</div>
          </div>
          <button type="button" class="icon-btn btn-sub desktop-only" data-action="close-drawer" aria-label="닫기">${ICON.close}</button>
        </div>

        <div class="flow">${flow}</div>

        <div class="fix-alert">
          <span class="fix-alert-icon">${ICON.fix}</span>
          <div><b>받았지만 그대로는 쓸 수 없는 자료예요</b>
            <small>수령으로 끝내지 않고, 사유를 골라 바로 쓸 수 있는 자료로 다시 받아요.</small></div>
        </div>

        <section class="fix-status">
          <div class="section-label">상태</div>
          <div class="status-seg" role="img" aria-label="현재 상태: 보완 요청">${statusSeg}</div>
        </section>

        <section class="fix-reason">
          <div class="section-label">무엇을 다시 받아야 하나요?</div>
          <div class="reason-grid" role="group" aria-label="보완 사유">${reasons}</div>
          ${reasonDetail(item, reason)}
        </section>

        <section class="preview">
          <div class="preview-head"><div class="preview-title">재요청 메일 미리보기</div></div>
          <div class="mail">
            <dl class="mail-head">
              <dt class="desktop-only">제목</dt><dd class="mail-subject">${esc(mail.subject)}</dd>
              <dt>받는 사람</dt><dd><span class="m-field">${esc(mail.to.name)}</span> <span class="desktop-only">${esc(mail.to.dept)}</span></dd>
            </dl>
            <div class="mail-body">${body}</div>
          </div>
        </section>
        ${mailDateDock(dates, state)}
      </div>

      <footer class="compose-foot">
        <div class="foot-note ${copied ? 'is-done' : ''}">${footNote}</div>
        <div class="foot-actions">
          <button type="button" class="btn btn-ghost" data-action="open-status" data-item="${esc(item.id)}">${ICON.done}수령 처리</button>
          <button type="button" class="btn btn-cta copy-btn" data-action="copy-fix">${ICON.copy}<span>재요청 메일 복사</span></button>
        </div>
      </footer>

      ${toast ? `
        <div class="compose-toast" role="status">
          <span class="toast-check">${ICON.done}</span>
          <span><b>메일을 복사했어요. 아웃룩에 붙여넣으세요.</b>
            <small>보완 요청 이력에 기록했어요<span class="desktop-only"> · 상태는 보완 요청 그대로예요</span></small></span>
        </div>` : ''}
    </aside>`;
}

// 선택한 사유의 구체적인 문제: 기준일 상이면 받은 기준일 → 필요한 기준일
function reasonDetail(item, reason) {
  if (reason === 'date') {
    const received = item.received?.basisDate;
    const required = item.fix?.requiredBasisDate;
    return `
      <div class="fix-detail basis">
        <span class="basis-box is-wrong"><small>받은 자료 기준일</small><b>${received ? received.replaceAll('-', '.') : '확인 필요'}</b></span>
        <span class="basis-arrow">${ICON.arrow}</span>
        <span class="basis-box is-right"><small>필요한 기준일</small><b>${required ? required.replaceAll('-', '.') : '확인 필요'}</b></span>
      </div>`;
  }
  const text = reason === 'file' ? '첨부 파일이 열리지 않거나 내용이 깨져 보임' : fixDetail(item, reason);
  return `<div class="fix-detail"><small>확인한 문제</small><b>${esc(text)}</b></div>`;
}

return { renderFix };
})();

const PASTE_EXAMPLE = [

/**

// 필요일을 고르면 남은 날과 위험도를 미리 보여준다.
function needPreview(neededOn, today) {
  const iso = normalizeDate(neededOn, today);
  if (!iso) {
    return `<div class="need-preview is-empty"><span>필요일을 고르면 남은 날과 위험도를 미리 보여드려요.</span></div>`;
  }
  const left = daysBetween(today, iso);
  const risk = riskOf(left);
  return `
    <div class="need-preview">
      <div><small>필요일</small><b>${formatMDW(iso)} <span>· ${leftText(left)}</span></b></div>
      <span class="risk risk-${risk}">${ICON[risk]}${RISK_LABEL[risk]}</span>
    </div>`;
}

    </div>`;

/** textarea 입력 중에 미리보기만 다시 그릴 때도 쓴다. */
function pastePreview(parsed, today) {
  const { rows, headerSkipped, errorCount } = parsed;
  if (!rows.length) {
    return `<div class="pp-empty">붙여넣은 내용이 없어요. 엑셀에서 행을 복사해 위에 붙여넣어 주세요.</div>`;
  }
  const summary = `${rows.length}건 인식${errorCount ? ` · <b class="pp-warn">${errorCount}건 확인 필요</b>` : ''}`;
  const sorted = [...rows].sort((a, b) => {
    if (!a.value || !b.value) return (a.value ? 1 : 0) - (b.value ? 1 : 0);
    return leftOf(a.value, today) - leftOf(b.value, today);
  });
  const body = sorted.map((r) => {
    if (!r.value) {
      return `
        <div class="pp-row is-error">
          <div class="pp-name">${esc(r.cells[0] || '(자료명 없음)')}</div>
          <div class="pp-owner">${esc(r.cells[1] || '')}</div>
          <div class="pp-date">${esc(r.cells[2] || '')}</div>
          <div class="pp-date">${esc(r.cells[3] || '')}</div>
          <div class="pp-left"><span class="pp-err">${ICON.high}${rowErrorText(r.errors)}</span></div>
        </div>`;
    }
    const left = leftOf(r.value, today);
    const risk = riskOf(left);
    return `
      <div class="pp-row">
        <div class="pp-name">${esc(r.value.item.name)}${r.value.item.procedure ? `<small>${esc(r.value.item.procedure)}</small>` : ''}</div>
        <div class="pp-owner">${esc(r.value.item.owner)}</div>
        <div class="pp-date">${formatMD(r.value.item.requestedOn)}</div>
        <div class="pp-date">${formatMD(r.value.item.neededOn)}</div>
        <div class="pp-left"><b>${leftText(left)}</b><span class="risk risk-${risk}">${ICON[risk]}${RISK_LABEL[risk]}</span></div>
      </div>`;
  }).join('');

  return `
    <div class="pp-summary">${summary}${headerSkipped ? ' <span>· 첫 줄은 제목으로 보고 뺐어요</span>' : ''}<span class="desktop-only"> · 필요일이 가까운 순</span></div>
    <div class="pp-table">
      <div class="pp-row pp-head"><div>자료명</div><div>담당자</div><div>요청일</div><div>필요일</div><div>남은 날</div></div>
      ${body}
    </div>`;
}

function pasteSubmit(parsed) {

}

return { PASTE_EXAMPLE, renderAdd, pastePreview, pasteSubmit };

  // 메일 패널의 날짜 칩 '+' (드래그 대신 탭으로 추가)
  'add-mail-date': (el) => {
    const chip = el.closest('[data-drag-date]');
    addMailDate({ title: chip.dataset.title, date: chip.dataset.date, itemId: chip.dataset.item || null });
  },
  'add-paste': () => {
    const today = currentToday();
    const parsed = parsePaste(add.pasteText, today);
    if (!parsed.rows.length || parsed.errorCount) return;
    state = addItems(state, parsed.rows.map((r) => r.value));
    save(state);
    add = null;
    closeDrawer();
    toast(`${parsed.rows.length}건 추가했어요.`);
  },
  'copy-fix': () => {
    const today = currentToday();
    const item = withDays(state.items.find((x) => x.id === fix.itemId), today);
    const mail = buildFixMail({ item, person: state.people[item.owner], client: state.client, today, reason: fix.reason });
    const reason = fix.reason;
    return copyForDrawer(fix, { text: fixMailToText(mail) },
      (s, on, text, copy) => copyAndRecordFix(s, { itemId: item.id, reason, on, text }, copy));
  },
  'copy-bundle': () => {
    const sorted = bundleItems(state.items, bundle.owner, currentToday());
    const mail = buildBundleMail({
      sorted, person: state.people[bundle.owner], client: state.client,
      manager: state.team?.manager, tone: bundle.tone,
    });
    return copyForDrawer(bundle, { itemIds: sorted.map((x) => x.id), text: bundleMailToText(mail) });
  },
};

// 시트의 기준일 입력값을 상태에 옮겨 둔다 (다시 그려도 입력이 남도록)
function readSheetDates() {
  const root = document.querySelector('.sheet');
  if (!root || !sheet) return;
  sheet.basisDate = root.querySelector('[name="basisDate"]')?.value ?? sheet.basisDate;
  sheet.requiredBasisDate = root.querySelector('[name="requiredBasisDate"]')?.value ?? sheet.requiredBasisDate;
}

// 메일 속 날짜를 캘린더 일정으로 추가 (드롭·탭 공통)
function addMailDate({ title, date, itemId }) {
  const result = addEvent(state, { title, date, itemId: itemId || null });
  if (!result.added) { toast('이미 캘린더에 있는 일정이에요.'); return; }
  state = result.state;
  save(state);
  render();
  toast(`‘${title}’ ${formatMD(date)} 일정을 캘린더에 추가했어요.`);
}

// 달력 항목을 다른 날로 (드래그·날짜 입력 공통). 필요일이면 자료의 필요일 자체가 바뀐다.
function moveCalendarEntry(entryId, date) {
  if (!date) return;
  const before = state;
  state = moveEntry(state, entryId, date);
  if (state === before) return;
  save(state);
  if (cal) cal.selected = date;
  render();
  const [kind, id] = entryId.split(':');
  if (kind === 'need') {
    const item = state.items.find((x) => x.id === id);
    toast(`‘${item.name}’ 필요일을 ${formatMD(date)}로 옮겼어요. 우선순위와 메일 문구에 반영돼요.`);
  } else {
    toast(`일정을 ${formatMD(date)}로 옮겼어요.`);
  }
}

// 드래그앤드롭: 달력 항목(data-drag-entry) 또는 메일 날짜 칩(data-drag-date)을 날짜 칸/일정 패널/독에 놓는다.
app.addEventListener('dragstart', (e) => {
  const el = e.target.closest?.('[data-drag-entry], [data-drag-date]');
  if (!el) return;
  const payload = el.dataset.dragEntry
    ? { type: 'entry', id: el.dataset.dragEntry }
    : { type: 'date', title: el.dataset.title, date: el.dataset.date, itemId: el.dataset.item || null };
  e.dataTransfer.setData('text/plain', JSON.stringify(payload));
  e.dataTransfer.effectAllowed = 'move';
  el.classList.add('is-dragging');
});
app.addEventListener('dragend', (e) => e.target.classList?.remove('is-dragging'));
app.addEventListener('dragover', (e) => {
  const zone = e.target.closest?.('[data-drop]');
  if (!zone) return;
  e.preventDefault();
  zone.classList.add('is-over');
});
app.addEventListener('dragleave', (e) => e.target.closest?.('[data-drop]')?.classList.remove('is-over'));
app.addEventListener('drop', (e) => {
  const zone = e.target.closest?.('[data-drop]');
  if (!zone) return;
  e.preventDefault();
  zone.classList.remove('is-over');
  let payload;
  try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
  const target = zone.dataset.drop;
  if (payload.type === 'date') {
    addMailDate({ ...payload, date: target === 'dock' ? payload.date : target });
  } else if (payload.type === 'entry' && target !== 'dock') {
    moveCalendarEntry(payload.id, target);
  }
});

// 일정 패널의 날짜 입력으로 이동 (모바일·키보드)
app.addEventListener('change', (e) => {
  if (e.target.dataset.actionChange === 'cal-move') moveCalendarEntry(e.target.dataset.entry, e.target.value);
});

function readAddForm() {
  const form = document.getElementById('add-form');
  if (!form) return add?.form || {};
  return Object.fromEntries(['name', 'ownerName', 'ownerTitle', 'dept', 'requestedOn', 'neededOn', 'procedure']
    .map((k) => [k, form[k]?.value ?? '']));
}

// 일정 추가 (일정 탭 오른쪽 패널)
app.addEventListener('submit', (e) => {
  if (e.target.dataset.actionSubmit !== 'cal-add-event') return;
  e.preventDefault();
  const title = e.target.title.value.trim();
  if (!title) {
    cal.form = { title: '', errors: { title: '일정 이름을 입력해 주세요.' } };
    render();
    app.querySelector('.cal-add input')?.focus();
    return;
  }
  const result = addEvent(state, { title, date: cal.selected });
  if (result.added) { state = result.state; save(state); }
  cal.form = { title: '', errors: {} };
  render();
  toast(result.added ? `‘${title}’ 일정을 ${formatMD(cal.selected)}에 추가했어요.` : '같은 일정이 이미 있어요.');
});

// 한 건 저장: 검증에 걸리면 입력값을 유지한 채 오류를 보여준다.
app.addEventListener('submit', (e) => {
  if (e.target.dataset.actionSubmit !== 'add-single') return;
  e.preventDefault();
  const today = currentToday();
  add.form = readAddForm();
  const { errors, value } = validateItem(add.form, today);
  add.errors = errors;
  if (!value) {
    render();
    app.querySelector('.f.has-error input')?.focus();
    return;
  }
  state = addItems(state, [value]);
  save(state);
  add = null;
  closeDrawer();
  toast(`‘${value.item.name}’${josa(value.item.name, '을', '를')} 추가했어요.`);
});

// 붙여넣기: 입력할 때마다 미리보기와 저장 버튼만 갱신한다 (textarea 포커스 유지).
app.addEventListener('input', (e) => {
  if (e.target.dataset.actionInput === 'paste') {
    add.pasteText = e.target.value;
    const parsed = parsePaste(add.pasteText, currentToday());
    app.querySelector('.paste-preview').innerHTML = pastePreview(parsed, currentToday());
    app.querySelector('.modal-foot .btn-cta').outerHTML = pasteSubmit(parsed);
  } else if (e.target.name === 'neededOn' && e.target.form?.id === 'add-form') {
    add.form = readAddForm();
    add.errors = {};
    render();
    app.querySelector('[name="neededOn"]')?.focus();
  }
});

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  actions[el.dataset.action]?.(el);
});

window.addEventListener('hashchange', render);
window.addEventListener('popstate', render);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (sheet) { sheet = null; render(); return; }
  if (compose || bundle || fix || add) closeDrawer();
});

// 개발용: 콘솔에서 pbc.reset() 하면 첫 실행 화면으로 돌아간다.
window.pbc = { reset() { clear(); state = null; compose = bundle = fix = add = sheet = cal = null; render(); } };

render();

})();

</script>
